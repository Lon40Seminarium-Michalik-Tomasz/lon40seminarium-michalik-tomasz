<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Operacje na ułamkach</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #8b0000;
            font-style: italic;
            margin-top: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        fieldset {
            background-color: #dbe4ea;
            border-radius: 10px;
            padding: 20px;
            width: 400px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        legend {
            font-size: 24px;
        }

        .fraction {
            display: inline-block;
            text-align: center;
            margin: 5px;
        }

        .fraction input {
            width: 60px;
            text-align: center;
            font-size: 18px;
        }

        .line {
            border-top: 2px solid black;
            margin: 2px 0;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<h1>Operacje na ułamkach</h1>

<div class="container">

    <!-- Skracanie -->
    <fieldset>
        <legend>Skracanie</legend>

        <div class="fraction">
            <input type="number" id="num1">
            <div class="line"></div>
            <input type="number" id="den1">
        </div>

        <br>
        <button onclick="reduceFraction()">Skróć</button>

        <div class="result">
            Ułamek skrócony ma postać:<br><br>
            <div class="fraction">
                <input type="text" id="rNum" readonly>
                <div class="line"></div>
                <input type="text" id="rDen" readonly>
            </div>
        </div>
    </fieldset>

    <!-- Dodawanie -->
    <fieldset>
        <legend>Dodawanie</legend>

        <div class="fraction">
            <input type="number" id="num2">
            <div class="line"></div>
            <input type="number" id="den2">
        </div>

        +

        <div class="fraction">
            <input type="number" id="num3">
            <div class="line"></div>
            <input type="number" id="den3">
        </div>

        =

        <div class="fraction">
            <input type="text" id="sumNum" readonly>
            <div class="line"></div>
            <input type="text" id="sumDen" readonly>
        </div>

        <br>
        <button onclick="addFractions()">Dodaj</button>
    </fieldset>

    <!-- Odejmowanie -->
    <fieldset>
        <legend>Odejmowanie</legend>

        <div class="fraction">
            <input type="number" id="num4">
            <div class="line"></div>
            <input type="number" id="den4">
        </div>

        -

        <div class="fraction">
            <input type="number" id="num5">
            <div class="line"></div>
            <input type="number" id="den5">
        </div>

        =

        <div class="fraction">
            <input type="text" id="subNum" readonly>
            <div class="line"></div>
            <input type="text" id="subDen" readonly>
        </div>

        <br>
        <button onclick="subtractFractions()">Odejmij</button>
    </fieldset>

</div>

<script>
    function gcd(a, b) {
        return b === 0 ? a : gcd(b, a % b);
    }

    function reduceFraction() {
        let num = parseInt(document.getElementById("num1").value);
        let den = parseInt(document.getElementById("den1").value);

        if (den === 0) {
            alert("Mianownik nie może być zerem!");
            return;
        }

        let divisor = gcd(Math.abs(num), Math.abs(den));
        document.getElementById("rNum").value = num / divisor;
        document.getElementById("rDen").value = den / divisor;
    }

    function addFractions() {
        let n1 = parseInt(document.getElementById("num2").value);
        let d1 = parseInt(document.getElementById("den2").value);
        let n2 = parseInt(document.getElementById("num3").value);
        let d2 = parseInt(document.getElementById("den3").value);

        if (d1 === 0 || d2 === 0) {
            alert("Mianownik nie może być zerem!");
            return;
        }

        let numerator = n1 * d2 + n2 * d1;
        let denominator = d1 * d2;

        let divisor = gcd(Math.abs(numerator), Math.abs(denominator));

        document.getElementById("sumNum").value = numerator / divisor;
        document.getElementById("sumDen").value = denominator / divisor;
    }

    function subtractFractions() {
        let n1 = parseInt(document.getElementById("num4").value);
        let d1 = parseInt(document.getElementById("den4").value);
        let n2 = parseInt(document.getElementById("num5").value);
        let d2 = parseInt(document.getElementById("den5").value);

        if (d1 === 0 || d2 === 0) {
            alert("Mianownik nie może być zerem!");
            return;
        }

        let numerator = n1 * d2 - n2 * d1;
        let denominator = d1 * d2;

        let divisor = gcd(Math.abs(numerator), Math.abs(denominator));

        document.getElementById("subNum").value = numerator / divisor;
        document.getElementById("subDen").value = denominator / divisor;
    }
</script>

</body>
</html>
