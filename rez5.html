<!-- ====== PLIK 2: 5-paskowy kalkulator ====== -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator rezystora 5-paskowego</title>
<style>
body { font-family: Arial; background:#dcdcdc; padding:20px; text-align:center; }
h1 { font-size:40px; font-style:italic; }
select { margin:5px; padding:5px; }
#result { margin-top:20px; font-size:28px; }

.resistor {
  margin:40px auto;
  width:500px;
  height:100px;
  background:#d6d3b5;
  border-radius:50px;
  position:relative;
}

.wire {
  position:absolute;
  width:150px;
  height:6px;
  background:#000;
  top:50%;
}
.left { left:-150px; }
.right { right:-150px; }

.band {
  position:absolute;
  width:20px;
  height:100%;
}

.placeholder { margin-top:30px; height:150px; border:2px dashed #777; }
</style>
</head>
<body>

<h1>Kalkulator kodów rezystorów (5 pasków)</h1>

<div class="resistor">
  <div class="wire left"></div>
  <div class="wire right"></div>
  <div id="band1" class="band" style="left:70px"></div>
  <div id="band2" class="band" style="left:110px"></div>
  <div id="band3" class="band" style="left:150px"></div>
  <div id="band4" class="band" style="left:190px"></div>
  <div id="band5" class="band" style="right:60px"></div>
</div>

<div>
Pasek 1: <select id="b1"></select>
Pasek 2: <select id="b2"></select>
Pasek 3: <select id="b3"></select>
Mnożnik: <select id="mult"></select>
Tolerancja: <select id="tol"></select>
</div>

<div id="result"></div>

<div>
  <img src="images/rezy5.jpg" style="max-width:100%;">
</div>


<script>
const colorMap = {
czarny:"black", brązowy:"brown", czerwony:"red", pomarańczowy:"orange",
żółty:"yellow", zielony:"green", niebieski:"blue", fioletowy:"violet",
szary:"gray", biały:"white", złoty:"gold", srebrny:"silver"
};

const colors = Object.keys(colorMap).slice(0,10).map((c,i)=>[c,i]);
const mults = [
["czarny",1],["brązowy",10],["czerwony",100],["pomarańczowy",1000],["żółty",10000],
["zielony",100000],["niebieski",1000000],["złoty",0.1],["srebrny",0.01]
];
const tolerances = [
["brązowy","±1%"],["czerwony","±2%"],["zielony","±0.5%"],["niebieski","±0.25%"],
["fioletowy","±0.1%"],["szary","±0.05%"],["złoty","±5%"],["srebrny","±10%"]
];

function fill(id, arr) {
let sel = document.getElementById(id);
arr.forEach(v => {
let o = document.createElement("option");
o.text = v[0];
o.value = v[1];
sel.add(o);
});
}

fill("b1", colors);
fill("b2", colors);
fill("b3", colors);
fill("mult", mults);

let tolSel = document.getElementById("tol");
tolerances.forEach(v => {
let o = document.createElement("option");
o.text = v[0] + " ("+v[1]+")";
o.value = v[1];
tolSel.add(o);
});

function update(){
  // 3 cyfry znaczące!
  let baseValue = (b1.value*100 + b2.value*10 + Number(b3.value)) * mult.value;

  // tolerancja
  let tolText = tol.value;
  let tolPercent = parseFloat(tolText.replace("±","").replace("%",""));

  let min = baseValue * (1 - tolPercent/100);
  let max = baseValue * (1 + tolPercent/100);

  result.innerText = 
    "Wartość rezystancji: " + baseValue + " Ω " + tolText +
    "\nZakres: " + min.toFixed(2) + " Ω – " + max.toFixed(2) + " Ω";

  // kolory pasków
  band1.style.background = colorMap[b1.options[b1.selectedIndex].text];
  band2.style.background = colorMap[b2.options[b2.selectedIndex].text];
  band3.style.background = colorMap[b3.options[b3.selectedIndex].text];
  band4.style.background = colorMap[mult.options[mult.selectedIndex].text];
  band5.style.background = colorMap[tol.options[tol.selectedIndex].text.split(" ")[0]];
}

[b1,b2,b3,mult,tol].forEach(el=>el.addEventListener("change",update));
update();
</script>
</body>
</html>
